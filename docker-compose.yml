# Local development stack for testing the rc-auto-reply app.
# Usage: docker compose up -d  (then run dev/bootstrap.sh once)
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "
        try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  rocketchat:
    image: rocketchat/rocket.chat:8.9.0
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://mongo:27017/rocketchat?replicaSet=rs0&directConnection=true
      - MONGO_OPLOG_URL=mongodb://mongo:27017/local?replicaSet=rs0&directConnection=true
      - DEPLOY_PLATFORM=docker-compose
    volumes:
      - rocket_data:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongo_data:
  rocket_data:
